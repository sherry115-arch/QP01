alse">音效：關</button><button id="music" aria-pressed="false">♫ 音樂：關</button></div></header><main><div class="layout"><aside><span class="eyebrow">CIVIC JOURNAL</span><h1>憲法與<br>人權保障</h1><p>把「我覺得」變成<br>有理由的公民觀點。</p><nav class="nav" aria-label="學習活動"><button data-page="learn">01　概念手札</button><button data-page="sort">02　規範排序室</button><button data-page="quiz">03　生活議題卡</button><button data-page="work">04　我的公民提案</button></nav><div class="note"><b id="badge">觀察者</b><p id="progressText"></p><progress id="progress" max="19" value="0"></progress><small>不用計時、不比排名。<br>每一次修正都算前進。</small></div></aside><section class="paper" id="panel"></section></div></main><footer>依公民2上第2課教材主題重新設計，情境與題目為原創。權利分類依本課教學架構；真實事件可能涉及多種權利。<br><a href="https://www.president.gov.tw/Page/94" target="_blank" rel="noopener">延伸閱讀：總統府・憲法本文</a> · 進度與文字草稿保存在這台裝置；按下投稿才會傳送。</footer>

const $=s=>document.querySelector(s);let state={done:[],draft:{},size:18};try{state={...state,...JSON.parse(localStorage.getItem('civic2-journal')||'{}')}}catch(e){}let page='learn',level=0,qi=0,answered=false,order=['命令','憲法','法律'],sfx=false,ctx,musicTimer;
const save=()=>{try{localStorage.setItem('civic2-journal',JSON.stringify(state))}catch(e){}};function reward(id){if(!state.done.includes(id)){state.done.push(id);save();tone(660)}update()}function update(){let n=state.done.length;$('#progress').value=n;$('#progressText').textContent=`已完成 ${n} / 19 個任務`;$('#badge').textContent=n>=19?'人權提案家':n>=10?'權利探索者':n>=4?'概念蒐集者':'觀察者'}function tone(f=440,force=false){if(!sfx&&!force)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.65);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.7)}catch(e){}}function read(t){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援朗讀。');return}if(speechSynthesis.speaking){speechSynthesis.cancel();return}let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}
const concepts=[['法律的兩種意思','廣義法律包含憲法、法律及命令等規範。狹義法律則是立法院通過、總統公布的法律。判斷時先看題目採用哪一種意思。'],['法律位階：先看誰在上面','憲法的效力最高，其次是法律，再來是命令。法律不能牴觸憲法；命令不能牴觸憲法或法律。行政機關依法訂定命令，補充執行的細節。'],['憲法的三個特性','最高性：其他法規須符合憲法。原則性：規範重要原則，細節交由法律與命令落實。固定性：修改程序較嚴格，不表示永遠不能修改。'],['四種權利，四個觀察角度','平等權：法律上的平等對待與機會，也容許有合理理由的差別待遇。自由權：避免無理干涉，例如言論、信仰、通訊自由。參政權：選舉、罷免、創制、複決、應考試及服公職。受益權：向國家請求保障生活利益或救濟，例如受國民教育、請願、訴願與訴訟。'],['保障書，不是政府的空白支票','憲法用最高性與較嚴格的修改程序，約束政府權力。基本權利被侵害時，可依相關法律尋求救濟。權利不是毫無界線，限制也不能只憑政府一句話。'],['沒有逐一列出，也可能受保障','憲法第22條讓未逐一列舉的自由與權利也能受到保障，例如隱私與文化相關權利。受國民教育則同時具有權利與義務的性質。']];

function show(p){page=p;if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let el=$('#panel');if(p==='learn'){el.innerHTML='<span class="eyebrow">FIELD NOTES / 概念先行</span><h2>你擁有的權利，比想像更靠近生活。</h2><p>點開手札，先掌握線索；也可以直接挑戰，再回來查閱。</p>'+concepts.map((c,i)=>`<details ${i===0?'open':''}><summary>${String(i+1).padStart(2,'0')}　${c[0]}</summary><p>${c[1]}</p><button class="read" data-i="${i}">朗讀／停止</button></details>`).join('')+'<div class="note">記憶線索：位階看效力，權利看情境，提案要有理由。</div>';el.querySelectorAll('.read').forEach(b=>b.onclick=()=>read(concepts[b.dataset.i].join('。')))}if(p==='sort')renderSort();if(p==='quiz')renderQuiz();if(p==='work')renderWork()}
function renderSort(){ $('#panel').innerHTML='<span class="eyebrow">RULE LAB / 規範排序室</span><h2>把規範放回正確位置</h2><p>由上到下排列：效力最高 → 效力最低。使用上下鍵即可，不需要拖曳。</p><div id="sortList"></div><button class="primary" id="checkSort">確認排序</button><div class="feedback" id="sortFeedback" role="status">先想想：誰能約束誰？</div><h3>生活對照</h3><p>憲法保障受國民教育 → 法律規劃教育制度 → 命令補充實施細節。</p>';drawSort();$('#checkSort').onclick=()=>{let ok=order.join()==='憲法,法律,命令';$('#sortFeedback').textContent=ok?'完成！憲法 ＞ 法律 ＞ 命令。低位階規範不得牴觸上位規範。':'再想一下：憲法是根本大法；行政機關的命令補充法律細節。';if(ok)reward('sort')}}function drawSort(){$('#sortList').innerHTML=order.map((x,i)=>`<div class="sortrow"><span>${i+1}　${x}</span><button data-i="${i}" data-d="-1" aria-label="${x}上移" ${i===0?'disabled':''}>↑</button><button data-i="${i}" data-d="1" aria-label="${x}下移" ${i===2?'disabled':''}>↓</button></div>`).join('');$('#sortList').querySelectorAll('button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,j=i+(+b.dataset.d);[order[i],order[j]]=[order[j],order[i]];drawSort()})}
function renderQuiz(){answered=false;const q=banks[level][qi];let options=[...q[1]].sort(()=>Math.random()-.5);$('#panel').innerHTML=`<span class="eyebrow">CASE CARDS / 生活議題卡</span><h2>你會如何判斷？</h2><div class="row">${['易｜概念入門','中｜生活應用','難｜觀點思辨'].map((x,i)=>`<button data-level="${i}" class="${level===i?'active':''}">${x}</button>`).join('')}</div><p class="muted">可自由切換難度。每階6題，答錯後可以重試。</p><span class="tag">${qi+1} / 6　${state.done.includes('q'+level+qi)?'已掌握':'探索中'}</span><h3 id="question">${q[0]}</h3><button id="readQ">朗讀／停止</button><div class="options">${options.map(x=>`<button class="answer">${x}</button>`).join('')}</div><div class="feedback" id="feedback" role="status">選一個最符合題意的答案。</div><div class="row"><button id="prev">上一題</button><button id="next">下一題</button><button id="hint">給我線索</button></div>`;$('#readQ').onclick=()=>read(q[0]+'。'+options.join('。'));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;qi=0;renderQuiz()});document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;if(b.textContent===q[2]){answered=true;reward('q'+level+qi);b.classList.add('active');$('#feedback').textContent='✓ 判斷有根據！'+q[3]}else{b.disabled=true;$('#feedback').textContent='先排除這個選項。'+q[3]+' 再試一次。';tone(220)}});$('#prev').onclick=()=>{qi=(qi+5)%6;renderQuiz()};$('#next').onclick=()=>{qi=(qi+1)%6;renderQuiz()};$('#hint').onclick=()=>$('#feedback').textContent='線索：'+q[3]}
function renderWork(){$('#panel').innerHTML=`<span class="eyebrow">MY CIVIC VOICE / 提案工作桌</span><h2>讓一個日常問題，成為有理由的提案。</h2><p>選擇你關心的議題，說明權利、理由與可行行動。作品不公開展示，只送交老師指定的資料夾。</p><div class="grid"><label>作品代號（不必填真名）<input id="alias" maxlength="30" placeholder="例如：203-07"></label><label>提案主題<select id="topic"><option>讓公共圖書館更容易使用</option><option>讓社區行人更安全</option><option>保護數位生活的隱私</option><option>我的自訂議題</option></select></label></div><label>① 我觀察到的問題<textarea id="problem" maxlength="1500" placeholder="誰遇到什麼困難？請描述具體情境。"></textarea></label><label>② 涉及的權利與理由<textarea id="reason" maxlength="1500" placeholder="我認為涉及……權，因為……。"></textarea></label><label>③ 我的建議與不同觀點<textarea id="action" maxlength="1500" placeholder="我建議……；有人可能擔心……，我會……。"></textarea></label><label>附上作品（選填：JPG、PNG 或 PDF，最多3MB）<input id="attachment" type="file" accept="image/jpeg,image/png,application/pdf"></label><p class="muted">避免填入電話、地址或其他人的個人資料。附件不會存入本機草稿。</p><div class="row"><button id="review">檢查提案完整度</button><button id="download">下載我的文字作品</button><button id="submit" class="primary">投稿給老師</button></div><div class="feedback" id="workFeedback" role="status">草稿會自動保存在此裝置。</div>`;['alias','topic','problem','reason','action'].forEach(k=>{if(state.draft[k])$('#'+k).value=state.draft[k];$('#'+k).oninput=()=>{state.draft[k]=$('#'+k).value;save()}});$('#review').onclick=()=>{const empty=['problem','reason','action'].filter(k=>!$('#'+k).value.trim());$('#workFeedback').textContent=empty.length?'還有 '+empty.length+' 個段落未完成。試著加入情境、權利理由與可行行動。':'三段都已填寫！請再自評：權利分類有依據嗎？建議能執行嗎？有回應不同觀點嗎？這是完整度提示，不是內容正確性的評分。'};$('#download').onclick=()=>{const b=new Blob([workText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='我的公民提案.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#submit').onclick=submitWork}
function workText(){return '公民第2課｜我的公民提案\n'+['alias','topic','problem','reason','action'].map((k,i)=>['作品代號','主題','觀察','權利與理由','建議與不同觀點'][i]+'：'+$('#'+k).value).join('\n\n')+'\n\n學習進度：'+state.done.length+'/19';}
async function submitWork(){let out=$('#workFeedback');if(!GAS_URL){out.textContent='投稿尚未開通：請老師填入 GAS 部署網址。你可以先下載作品保存。';return}if(['alias','problem','reason','action'].some(k=>!$('#'+k).value.trim())){out.textContent='請填寫作品代號及三個提案段落。';return}const f=$('#attachment').files[0];if(f&&(f.size>3*1024*1024||!['image/jpeg','image/png','application/pdf'].includes(f.type))){out.textContent='請選擇3MB以內的 JPG、PNG 或 PDF。';return}$('#submit').disabled=true;out.textContent='正在準備投稿；送出後請在新分頁查看老師收件系統的確認結果。';try{let data={alias:$('#alias').value,text:workText(),nonce:crypto.randomUUID?crypto.randomUUID():Date.now().toString()};if(f){data.file={name:f.name,type:f.type,data:await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}}let form=document.createElement('form');form.method='POST';form.action=GAS_URL;form.target='_blank';let input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(data);form.append(input);document.body.append(form);form.submit();form.remove();out.textContent='已送出投稿請求。請到新分頁確認「收件成功」及收件編號；若未出現，請保留下載作品。'}catch(e){out.textContent='無法送出，請下載作品保存後再試。'}finally{$('#submit').disabled=false}}
$('#smaller').onclick=()=>{state.size=Math.max(16,state.size-2);document.documentElement.style.fontSize=state.size+'px';save()};$('#larger').onclick=()=>{state.size=Math.min(26,state.size+2);document.documentElement.style.fontSize=state.size+'px';save()};$('#sound').onclick=()=>{sfx=!sfx;$('#sound').textContent='音效：'+(sfx?'開':'關');$('#sound').setAttribute('aria-pressed',sfx);tone()};$('#music').onclick=()=>{if(musicTimer){clearInterval(musicTimer);musicTimer=null}else{let n=0,notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];tone(notes[n++],true);musicTimer=setInterval(()=>tone(notes[n++%notes.length],true),1400)}$('#music').textContent='♫ 音樂：'+(musicTimer?'開':'關');$('#music').setAttribute('aria-pressed',!!musicTimer)};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(musicTimer)$('#music').click();if('speechSynthesis'in window)speechSynthesis.cancel()}});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.documentElement.style.fontSize=state.size+'px';update();show('learn');
