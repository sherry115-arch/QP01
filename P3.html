const concepts=[["權力，還是權利？", "權力是影響、要求他人行為的力量，例如政府依法執行政策。權利是人可以主張與享有的保障，例如表達意見與接受教育。政府行使權力，應以保障人民權利為目的。"], ["有法律，就一定是法治嗎？", "不一定。人治也可能有法律，但統治者能依個人喜好改變規則，並把法律當成統治工具。法治要求政府也受法律拘束，不能因身分或喜好而例外。"], ["有限政府：有限的是什麼？", "政府的職權與運作受到憲法、法律與監督機制約束。有限政府不是政府什麼都不做，也不是只看員工人數，而是政府不能無限擴張權力。"], ["三權分立：分工也制衡", "本課以孟德斯鳩的學說說明三權分立。行政權執行政策；立法權制定法律並監督政府；司法權依法審理爭議。分工配合制度上的相互制衡，可以降低權力集中的風險。"], ["五權分立：多出的兩權", "依孫文五權分立的學說，從行政權分出考試權，追求公正選才；從立法權分出監察權，避免國會權力過度集中。另保留行政、立法與司法三權。"], ["制衡的終點：保障人民", "分權不是為了讓機關互相阻擋，也不是哪一權永遠最大。制度讓決策接受檢驗、權利受侵害時有救濟，並透過公民監督促進政府負責。"]];

function renderSort(){const tasks=[['推動並執行公共政策','行政權'],['制定法律與監督政府','立法權'],['依法審理爭議','司法權'],['依五權學說，公正選拔公務人才','考試權'],['依五權學說，獨立的監察職能','監察權']];$('#panel').innerHTML='<span class="eyebrow">POWER DESK / 權力分工台</span><h2>讓每個任務找到負責的權力</h2><p>為五張任務單選擇分工，再檢查你的設計。</p><div class="dispatch">'+tasks.map((t,i)=>'<label>'+t[0]+'<select id="job'+i+'"><option value="">請選擇</option>'+['行政權','立法權','司法權','考試權','監察權'].map(x=>'<option>'+x+'</option>').join('')+'</select><small id="jobHint'+i+'"></small></label>').join('')+'</div><button class="primary" id="checkSort">檢查分工</button><div class="feedback" id="sortFeedback" role="status">分工完成後，想想：只有分工，沒有互相監督，夠嗎？</div>';$('#checkSort').onclick=()=>{let n=0;tasks.forEach((t,i)=>{let ok=$('#job'+i).value===t[1];if(ok)n++;$('#jobHint'+i).textContent=ok?'✓ 分工正確':'再想想：'+t[1]+'的核心任務與這張單子相符。'});$('#sortFeedback').textContent=n===5?'五項分工完成！分立還需要配合實際制衡，才能降低濫權風險。':'已完成 '+n+' / 5 項。參考線索，再調整你的分工。';if(n===5)reward('sort')}}
function renderQuiz(){answered=false;const q=banks[level][qi];let options=[...q[1]];for(let i=options.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}$('#panel').innerHTML=`<span class="eyebrow">DECISION LAB / 決策練習場</span><h2>你會如何判斷？</h2><div class="row">${['易｜概念入門','中｜生活應用','難｜觀點思辨'].map((x,i)=>`<button data-level="${i}" class="${level===i?'active':''}">${x}</button>`).join('')}</div><p class="muted">可自由切換難度。每階6題，答錯後可以重試。</p><span class="tag">${qi+1} / 6　${state.done.includes('q'+level+qi)?'已掌握':'探索中'}</span><h3 id="question">${q[0]}</h3><button id="readQ">朗讀／停止</button><div class="options">${options.map(x=>`<button class="answer">${x}</button>`).join('')}</div><div class="feedback" id="feedback" role="status">選一個最符合題意的答案。</div><div class="row"><button id="prev">上一題</button><button id="next">下一題</button><button id="hint">給我線索</button></div>`;$('#readQ').onclick=()=>read(q[0]+'。'+options.join('。'));document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;qi=0;renderQuiz()});document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered)return;if(b.textContent===q[2]){answered=true;reward('q'+level+qi);b.classList.add('active');$('#feedback').textContent='✓ 判斷有根據！'+q[3]}else{b.disabled=true;$('#feedback').textContent='先排除這個選項。'+q[3]+' 再試一次。';tone(220)}});$('#prev').onclick=()=>{qi=(qi+5)%6;renderQuiz()};$('#next').onclick=()=>{qi=(qi+1)%6;renderQuiz()};$('#hint').onclick=()=>$('#feedback').textContent='線索：'+q[3]}
function renderWork(){$('#panel').innerHTML=`<span class="eyebrow">DESIGN A SYSTEM / 制度設計桌</span><h2>設計一套「不靠某個人永遠正確」的制度。</h2><p>選擇一個情境，安排權力、監督與申訴方式。作品不公開展示，只送交老師指定的資料夾。</p><div class="grid"><label>作品代號（不必填真名）<input id="alias" maxlength="30" placeholder="例如：203-07"></label><label>提案主題<select id="topic"><option>學生自治會的經費使用</option><option>公共建設的決策程序</option><option>公務人才的公平選拔</option><option>我的自訂議題</option></select></label></div><label>① 哪裡有權力過度集中的風險？<textarea id="problem" maxlength="1500" placeholder="如果由同一個人決定所有事情，可能……。"></textarea></label><label>② 誰負責執行？誰負責監督？<textarea id="reason" maxlength="1500" placeholder="我把……交給……，由……檢查，理由是……。"></textarea></label><label>③ 當事人如何提出異議？有什麼代價？<textarea id="action" maxlength="1500" placeholder="如果有人不服，可以……；這套制度可能增加……成本，我會……。"></textarea></label><label>附上作品（選填：JPG、PNG 或 PDF，最多3MB）<input id="attachment" type="file" accept="image/jpeg,image/png,application/pdf"></label><p class="muted">避免填入電話、地址或其他人的個人資料。附件不會存入本機草稿。</p><div class="row"><button id="review">檢查提案完整度</button><button id="download">下載我的文字作品</button><button id="submit" class="primary">投稿給老師</button></div><div class="feedback" id="workFeedback" role="status">草稿會自動保存在此裝置。</div>`;['alias','topic','problem','reason','action'].forEach(k=>{if(state.draft[k])$('#'+k).value=state.draft[k];$('#'+k).oninput=()=>{state.draft[k]=$('#'+k).value;save()}});$('#review').onclick=()=>{const empty=['problem','reason','action'].filter(k=>!$('#'+k).value.trim());$('#workFeedback').textContent=empty.length?'還有 '+empty.length+' 個段落未完成。試著加入情境、權利理由與可行行動。':'三段都已填寫！請再自評：分工清楚嗎？監督者能獨立判斷嗎？有提供異議途徑嗎？這是完整度提示，不是內容正確性的評分。'};$('#download').onclick=()=>{const b=new Blob([workText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='我的制度設計.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#submit').onclick=submitWork}
function workText(){return '公民第3課｜我的制度設計\n'+['alias','topic','problem','reason','action'].map((k,i)=>['作品代號','主題','觀察','分工與制衡','異議途徑與代價'][i]+'：'+$('#'+k).value).join('\n\n')+'\n\n學習進度：'+state.done.length+'/19';}
async function submitWork(){let out=$('#workFeedback');if(!GAS_URL){out.textContent='投稿尚未開通：請老師填入 GAS 部署網址。你可以先下載作品保存。';return}if(['alias','problem','reason','action'].some(k=>!$('#'+k).value.trim())){out.textContent='請填寫作品代號及三個提案段落。';return}const f=$('#attachment').files[0];if(f&&(f.size>3*1024*1024||!['image/jpeg','image/png','application/pdf'].includes(f.type))){out.textContent='請選擇3MB以內的 JPG、PNG 或 PDF。';return}$('#submit').disabled=true;out.textContent='正在準備投稿；送出後請在新分頁查看老師收件系統的確認結果。';try{let data={alias:$('#alias').value,text:workText(),nonce:crypto.randomUUID?crypto.randomUUID():Date.now().toString()};if(f){data.file={name:f.name,type:f.type,data:await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}}let form=document.createElement('form');form.method='POST';form.action=GAS_URL;form.target='_blank';let input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify(data);form.append(input);document.body.append(form);form.submit();form.remove();out.textContent='已送出投稿請求。請到新分頁確認「收件成功」及收件編號；若未出現，請保留下載作品。'}catch(e){out.textContent='無法送出，請下載作品保存後再試。'}finally{$('#submit').disabled=false}}
$('#smaller').onclick=()=>{state.size=Math.max(16,state.size-2);document.documentElement.style.fontSize=state.size+'px';save()};$('#larger').onclick=()=>{state.size=Math.min(26,state.size+2);document.documentElement.style.fontSize=state.size+'px';save()};$('#sound').onclick=()=>{sfx=!sfx;$('#sound').textContent='音效：'+(sfx?'開':'關');$('#sound').setAttribute('aria-pressed',sfx);tone()};$('#music').onclick=()=>{if(musicTimer){clearInterval(musicTimer);musicTimer=null}else{let n=0,notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];tone(notes[n++],true);musicTimer=setInterval(()=>tone(notes[n++%notes.length],true),1400)}$('#music').textContent='♫ 音樂：'+(musicTimer?'開':'關');$('#music').setAttribute('aria-pressed',!!musicTimer)};document.addEventListener('visibilitychange',()=>{if(document.hidden){if(musicTimer)$('#music').click();if('speechSynthesis'in window)speechSynthesis.cancel()}});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.documentElement.style.fontSize=state.size+'px';update();show('learn');
